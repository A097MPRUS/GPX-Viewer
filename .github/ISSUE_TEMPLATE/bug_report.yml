name: Problem report
description: Something in GPX Viewer or GPX Viewer Web Lite does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not attach private GPS recordings or health data. A short synthetic file that shows the problem is enough.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - macOS, Apple silicon
        - macOS, Intel
        - Windows
        - Web Lite (browser)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GPX Viewer version and system
      placeholder: "0.2.0 (build 3) on macOS 15.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, the map in use, and the kind of file (device or application that wrote it).
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
