# Validation for every push and pull request. Author: A097MPRUS.
# Nothing is deployed here.
name: Validate website

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency vulnerabilities (high and critical)
        run: npm audit --audit-level=high
      - name: Metadata, formatting, lint, types, tests, build, built-site checks
        run: npm run verify
        env:
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
      - name: Build and check under the GitHub Pages subpath
        run: npm run build && npm run validate:dist
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
