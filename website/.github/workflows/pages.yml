# Public deployment to GitHub Pages. Author: A097MPRUS.
#
# Disabled until the owner approves the public launch: the job runs only when the repository
# variable PUBLIC_LAUNCH is set to "approved" (Settings, Secrets and variables, Actions,
# Variables). On a free GitHub plan, Pages also requires this repository to be public; making it
# public is part of the approved launch, never automatic.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLIC_LAUNCH == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run verify
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_SITE_STAGE: public
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
